<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 420px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .title-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 0 15px 0;
    }
    .title-bar h1 {
      font-size: 18px;
      margin: 0;
    }
    .lang-select {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: #666;
    }
    .lang-select select {
      padding: 2px 4px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      background: #fff;
    }
    .card {
      background: white;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-size: 13px;
      font-weight: 500;
    }
    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 8px 10px;
      margin-bottom: 10px;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      box-sizing: border-box;
    }
    .search-input {
      margin-bottom: 10px;
    }
    .trigger-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .trigger-tab {
      flex: 1;
      padding: 8px 12px;
      background: #f0f0f0;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
    }
    .trigger-tab.active {
      background: #4CAF50;
      color: white;
    }
    .hidden {
      display: none !important;
    }
    button {
      padding: 10px 16px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      width: 100%;
      margin-bottom: 8px;
    }
    button:hover {
      background: #45a049;
    }
    button.secondary {
      background: #2196F3;
    }
    button.secondary:hover {
      background: #1976D2;
    }
    button.warning {
      background: #FF9800;
    }
    button.warning:hover {
      background: #F57C00;
    }
    button.danger {
      background: #f44336;
    }
    button.small {
      padding: 5px 10px;
      font-size: 12px;
      width: auto;
      margin: 0;
    }
    .step {
      background: #f5f5f5;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 10px;
    }
    .status {
      margin-top: 12px;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
    }
    .status.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .status.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .status.info {
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }
    .element-preview {
      background: #fff3cd;
      padding: 8px;
      border-radius: 5px;
      font-size: 12px;
      margin-bottom: 10px;
    }
    .config-list {
      max-height: 200px;
      overflow-y: auto;
    }
    .config-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 6px;
      border-bottom: 1px solid #eee;
      gap: 8px;
    }
    .config-item-header {
      flex: 1;
      min-width: 0;
      overflow: hidden;
    }
    .config-item-name {
      font-weight: 600;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .config-item-meta {
      font-size: 10px;
      color: #888;
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .config-item-actions {
      display: flex;
      gap: 3px;
      flex-shrink: 0;
    }
    .config-action-btn {
      padding: 4px 7px;
      font-size: 18px;
      width: auto;
      margin: 0;
      min-width: 32px;
      line-height: 1;
      border-radius: 6px;
      background: #f0f0f0;
      color: #333;
      position: relative;
      cursor: pointer;
    }
    .config-action-btn:hover {
      background: #e0e0e0;
    }
    .config-action-btn:hover::after {
      content: attr(title);
      position: absolute;
      top: calc(100% + 1px);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.75);
      color: #fff;
      font-size: 9px;
      padding: 2px 5px;
      border-radius: 4px;
      white-space: nowrap;
      pointer-events: none;
      z-index: 10;
    }
    .form-row {
      display: flex;
      gap: 10px;
    }
    .form-group {
      flex: 1;
    }
    .editing-mode {
      background: #e3f2fd;
      border: 1px solid #bbdefb;
      margin-bottom: 12px;
      padding: 10px;
      border-radius: 8px;
    }
    .condition-group {
      background: #f0f8ff;
      border: 1px solid #cce5ff;
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .condition-title {
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 13px;
      color: #0066cc;
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
    }
    .checkbox-label input[type="checkbox"] {
      width: auto;
      margin-bottom: 0;
    }

    .picker-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .picker-modal {
      background: #fff;
      border-radius: 10px;
      padding: 16px;
      width: 380px;
      max-height: 420px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }
    .picker-modal-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 10px;
    }
    .picker-select-all {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 0;
      border-bottom: 1px solid #e0e0e0;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 500;
    }
    .picker-select-all input[type="checkbox"] {
      width: auto;
      margin: 0;
    }
    .picker-list {
      flex: 1;
      overflow-y: auto;
      max-height: 240px;
      margin-bottom: 12px;
    }
    .picker-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 4px;
      border-bottom: 1px solid #f5f5f5;
      font-size: 13px;
    }
    .picker-item input[type="checkbox"] {
      width: auto;
      margin: 0;
      flex-shrink: 0;
    }
    .picker-item-info {
      flex: 1;
      min-width: 0;
      overflow: hidden;
    }
    .picker-item-name {
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .picker-item-meta {
      font-size: 10px;
      color: #888;
    }
    .picker-btns {
      display: flex;
      gap: 8px;
    }
    .picker-btns button {
      flex: 1;
    }
  </style>
</head>
<body>
  <div id="configPickerModal" class="picker-modal-overlay hidden">
    <div class="picker-modal">
      <div class="picker-modal-title" id="pickerTitle"></div>
      <label class="picker-select-all">
        <input type="checkbox" id="pickerSelectAll"> <span id="pickerSelectAllLabel"></span>
      </label>
      <div class="picker-list" id="pickerList"></div>
      <div class="picker-btns">
        <button id="pickerConfirmBtn" class="secondary"></button>
        <button id="pickerCancelBtn" class="danger"></button>
      </div>
    </div>
  </div>
  <div class="title-bar">
    <h1 data-i18n="title">🖱️ 自动点击器 Pro</h1>
    <div class="lang-select">
      <span data-i18n="langLabel">语言</span>
      <select id="langDropdown">
        <option value="zh">中文</option>
        <option value="en">English</option>
      </select>
    </div>
  </div>
  
  <div class="editing-mode" id="editingMode" style="display: none;">
    <strong data-i18n="editingConfig">✏️ 正在编辑配置</strong>
    <span id="editingConfigName"></span>
    <button id="cancelEditBtn" class="small danger" style="float: right;" data-i18n="cancel">取消</button>
  </div>
  
  <div class="card">
    <label data-i18n="configName">配置名称</label>
    <input type="text" id="configName" data-i18n-placeholder="configNamePlaceholder" placeholder="给这个配置起个名字">
  </div>
  
  <div class="card">
    <label data-i18n="triggerType">触发方式</label>
    <div class="trigger-tabs">
      <button class="trigger-tab active" data-trigger="website" data-i18n="triggerWebsite">🌐 网站</button>
      <button class="trigger-tab" data-trigger="element" data-i18n="triggerElement">🎯 页面元素</button>
      <button class="trigger-tab" data-trigger="text" data-i18n="triggerText">📝 页面文字</button>
      <button class="trigger-tab" data-trigger="combo" data-i18n="triggerCombo">🔗 组合条件</button>
    </div>
    
    <div id="triggerWebsite">
      <label data-i18n="websiteUrlLabel">网站地址（包含就触发）</label>
      <input type="text" id="websiteUrl" data-i18n-placeholder="websiteUrlPlaceholder" placeholder="例如：baidu.com">
    </div>
    
    <div id="triggerElement" class="hidden">
      <label data-i18n="triggerElementLabel">触发元素</label>
      <button id="pickTriggerElement" class="warning" data-i18n="pickElement">👆 选择/重新选择元素</button>
      <div id="triggerElementPreview" class="element-preview hidden"></div>
    </div>
    
    <div id="triggerText" class="hidden">
      <label data-i18n="textTriggerLabel">页面包含以下文字时触发</label>
      <input type="text" id="triggerTextContent" data-i18n-placeholder="textTriggerPlaceholder" placeholder="输入要检测的文字">
    </div>
    
    <div id="triggerCombo" class="hidden">
      <div class="condition-group">
        <div class="condition-title" data-i18n="comboTitle">组合条件（需要同时满足）</div>
        <label class="checkbox-label">
          <input type="checkbox" id="comboRequireWebsite"> <span data-i18n="comboRequireWebsite">必须在指定网站</span>
        </label>
        <input type="text" id="comboWebsiteUrl" class="hidden" data-i18n-placeholder="comboWebsitePlaceholder" placeholder="网站地址（包含）">
        <label class="checkbox-label" style="margin-top: 8px;">
          <input type="checkbox" id="comboRequireElement"> <span data-i18n="comboRequireElement">页面包含指定元素</span>
        </label>
        <button id="comboPickElement" class="warning small hidden" style="margin-bottom: 8px;" data-i18n="comboPickElement">👆 点击要触发的元素</button>
        <div id="comboElementPreview" class="element-preview hidden" style="padding: 10px;"></div>
        <label class="checkbox-label" style="margin-top: 8px;">
          <input type="checkbox" id="comboRequireText"> <span data-i18n="comboRequireText">页面包含指定文字</span>
        </label>
        <input type="text" id="comboTextContent" class="hidden" data-i18n-placeholder="comboTextPlaceholder" placeholder="输入要检测的文字">
      </div>
    </div>
  </div>
  
  <div class="card">
    <label data-i18n="triggerTiming">触发时机</label>
    
    <label class="checkbox-label">
      <input type="radio" id="triggerModeAuto" name="triggerMode" value="auto" checked> <span data-i18n="autoTrigger">自动触发（页面加载/轮询/监听）</span>
    </label>
    <label class="checkbox-label">
      <input type="radio" id="triggerModeManual" name="triggerMode" value="manual"> <span data-i18n="manualTrigger">仅手动触发</span>
    </label>
    
    <div id="autoTriggerOptions" style="margin-top: 12px;">
      <label class="checkbox-label">
        <input type="radio" name="autoMode" value="onLoad" checked> <span data-i18n="autoModeOnLoad">页面加载完成后触发（仅一次）</span>
      </label>
      <div class="form-row" id="loadDelayRow" style="margin-left: 24px; margin-top: 4px; margin-bottom: 8px;">
        <div class="form-group">
          <label data-i18n="loadDelay">加载完成后等待（毫秒）</label>
          <input type="number" id="loadDelay" placeholder="0" value="1000" min="0" style="margin-bottom: 0;">
        </div>
      </div>
      <label class="checkbox-label">
        <input type="radio" name="autoMode" value="polling"> <span data-i18n="autoModePolling">定期轮询</span>
      </label>
      <div class="form-row" id="pollingIntervalRow" style="display: none; margin-left: 24px; margin-top: 4px; margin-bottom: 8px;">
        <div class="form-group">
          <label data-i18n="pollingInterval">轮询间隔（毫秒）</label>
          <input type="number" id="pollingInterval" placeholder="3000" value="3000" min="1000" style="margin-bottom: 0;">
        </div>
      </div>
      <label class="checkbox-label">
        <input type="radio" name="autoMode" value="observer"> <span data-i18n="autoModeObserver">持续监听（页面变化时立即触发）</span>
      </label>
    </div>
  </div>
  
  <div style="margin-top: 15px; display: flex; gap: 8px;">
    <button id="exportBtn" class="secondary" style="flex: 1;" data-i18n="exportBtn">📤 导出配置</button>
    <button id="importBtn" class="warning" style="flex: 1;" data-i18n="importBtn">📥 导入配置</button>
  </div>
  <input type="file" id="importFile" accept=".json" style="display: none;">
  
  <div class="card">
    <label data-i18n="stepsLabel">操作步骤</label>
    <div id="stepsContainer"></div>
    <button id="addStepBtn" class="secondary" data-i18n="addStep">+ 添加步骤</button>
  </div>
  
  <button id="saveBtn" data-i18n="saveBtn">💾 保存</button>
  <button id="testBtn" class="secondary" data-i18n="testBtn">🧪 测试当前草稿</button>
  <button id="listBtn" class="warning" data-i18n="listBtn">📋 查看已保存</button>
  <button id="clearBtn" class="danger" data-i18n="clearBtn">🗑️ 清除草稿</button>
  
  <div id="listContainer" class="card hidden">
    <label data-i18n="searchLabel">搜索配置：</label>
    <input type="text" id="configSearch" class="search-input" data-i18n-placeholder="searchPlaceholder" placeholder="输入配置名称搜索...">
    <label data-i18n="savedConfigs">已保存的配置：</label>
    <div id="configList" class="config-list"></div>
  </div>
  
  <div id="status" class="status" style="display: none;"></div>
  
  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
